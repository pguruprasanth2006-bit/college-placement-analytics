{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 p-5">
            <h1 class="display-1 text-danger fw-bold">404</h1>
            <h3 class="mb-3">Page Not Found</h3>
            <p class="text-muted mb-4">The page or resource you are looking for does not exist or has been moved.</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2">
                <i class="bi bi-house-door me-2"></i>Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
