{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 p-5">
            <h1 class="display-1 text-warning fw-bold">500</h1>
            <h3 class="mb-3">Internal Server Error</h3>
            <p class="text-muted mb-4">An unexpected error occurred while processing your request. Please try again later.</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2">
                <i class="bi bi-house-door me-2"></i>Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
