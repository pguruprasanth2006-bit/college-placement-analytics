{% extends "base.html" %}

{% block title %}Admin Login - College Placement System{% endblock %}

{% block unauth_content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow border-0 p-4 rounded-4">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 bg-primary bg-opacity-10 text-primary rounded-circle mb-3">
                    <i class="bi bi-mortarboard-fill display-5"></i>
                </div>
                <h3 class="fw-bold text-dark">PlacementHub</h3>
                <p class="text-muted small">College Placement Analytics & Prediction System</p>
            </div>

            <form method="POST" action="{{ url_for('dashboard.login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control bg-light border-start-0" id="username" name="username" placeholder="Enter admin username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control bg-light border-start-0" id="password" name="password" placeholder="Enter admin password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Dashboard
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center">
                <small class="text-muted">Default Demo Credentials: <code>admin</code> / <code>admin123</code></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
